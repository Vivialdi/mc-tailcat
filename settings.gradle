pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'mc-tailcat'

include 'core'
include 'fabric'

// Optional, and version-locked; see gui/build.gradle for why it is separate.
include 'gui'
