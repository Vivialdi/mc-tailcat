modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/vivialdi/mc-tailcat/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://github.com/vivialdi/mc-tailcat"
authors = "vivialdi"
description = '''
Puts a Minecraft server and its players on the same tailcat tunnel. The server publishes its address on startup; clients read it and add the server to their multiplayer list automatically, and can paste an address from the multiplayer screen. No port forwarding, no accounts.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"
