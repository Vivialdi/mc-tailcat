org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod metadata
mod_id=tailcat
mod_name=Tailcat for Minecraft
mod_version=1.1.0
maven_group=dev.vivialdi.mctailcat

# The mod compiles against Fabric Loader only -- never against Minecraft or the
# Fabric API -- so a single jar runs on every Minecraft version this loader
# supports. Bumping this is the only thing needed to follow new loader releases.
fabric_loader_version=0.16.14

# The optional GUI companion mod. Unlike the main jar this one is tied to a
# single Minecraft version, because drawing a screen means touching Minecraft.
gui_minecraft_version=1.21.1
gui_yarn_mappings=1.21.1+build.3
gui_fabric_api_version=0.116.17+1.21.1

# The NeoForge build. There is no loader-only path on NeoForge -- every jar is
# built against one NeoForge/Minecraft version -- so main mod and GUI are one
# jar here, and it is version-locked the way the Fabric GUI companion is.
neoforge_version=21.1.249
